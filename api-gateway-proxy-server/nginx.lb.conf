events {}

http {
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    # Docker DNS: cập nhật IP khi service được recreate.
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_host $forwarded_port {
        default $server_port;
        ~:(?<public_port>[0-9]+)$ $public_port;
    }

    upstream web_pool {
        server web-frontend-server1:80;
        server web-frontend-server2:80;
    }

    server {
        listen 80;
        server_name _;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Dùng port từ URL public (quan trọng khi GATEWAY_PORT khác 80).
        proxy_set_header X-Forwarded-Port $forwarded_port;

        location / {
            proxy_pass http://web_pool;
            add_header X-Upstream-Addr $upstream_addr always;
            add_header Cache-Control "no-store" always;
        }

        location /api/ {
            set $app application-backend-server:8081;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://$app;
        }
        location = /auth { return 308 /auth/; }
        location /auth/ {
            set $auth authentication-identity-server:8080;
            # Giữ nguyên /auth/ vì Keycloak cũng chạy dưới /auth.
            proxy_pass http://$auth;
        }
        location = /student/ {
            set $app application-backend-server:8081;
            proxy_pass http://$app/student$is_args$args;
        }
    }
}
